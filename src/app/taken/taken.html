<div class="taken">
    <input type="text" [(ngModel)]="niueuweTaak">
    <button (click)="taaktoevoegen()">Toevoegen</button>

    <ul>
        @for (taak of taken; track taak) {
        <li [style.color]="gevinteTaken.includes(taak) ? 'green' : 'black'">
            {{taak}}
            <button (click)="taakverwijderen(taak)">Verwijderen</button>
            <button (click)="kleurveranderen(taak)">✓</button>
        </li>
        }

    </ul>
</div>
